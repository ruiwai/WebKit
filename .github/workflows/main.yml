name: CI
on: 
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v6
    - name: Setup upterm session
      uses: owenthereal/action-upterm@v2
      with:
        limit-access-to-actor: true # Restrict to the user who triggered the workflow
        limit-access-to-users: hilaolu
