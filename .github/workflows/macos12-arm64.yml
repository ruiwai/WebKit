name: macOS 12 arm64 release (best effort)

on:
  push:
    tags:
      - 'v*-macos12-arm64'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos12-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      BUILD_JOBS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check runner, toolchain, version and tag
        run: |
          set -euo pipefail
          mkdir -p WebKitBuild/CI-logs
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee WebKitBuild/CI-logs/xcode.txt
          xcodebuild -showsdks > WebKitBuild/CI-logs/sdks.txt
          df -h .
          python3 .github/scripts/macos12-release.py version
          if ! xcrun --sdk macosx metal -v; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal -v
      - name: Check deployment and selector regressions
        run: |
          set -euo pipefail
          python3 .github/scripts/test_macos12_release.py
          python3 ManualTests/macOS12-platform-availability.py 2>&1 | tee WebKitBuild/CI-logs/platform-tests.txt
          python3 ManualTests/macOS12-proxy-availability.py 2>&1 | tee WebKitBuild/CI-logs/proxy-tests.txt
      - name: Prepare Xcode 26 build graph
        run: |
          set -euo pipefail
          python3 .github/scripts/macos12-release.py prepare
          git diff --binary > WebKitBuild/CI-logs/xcode26-project.patch
      - name: Build optimized arm64 (retry without LTO on failure)
        run: bash .github/scripts/build-macos12-arm64.sh
      - name: Assemble and verify development package
        run: python3 .github/scripts/macos12-release.py package
      - name: Smoke test on macOS 26 (not Monterey validation)
        run: |
          set -euo pipefail
          root="$PWD/WebKitBuild/CI-package/MacOS12-arm64"
          export DYLD_FRAMEWORK_PATH="$root/Release" DYLD_LIBRARY_PATH="$root/Release"
          export __XPC_DYLD_FRAMEWORK_PATH="$root/Release" __XPC_DYLD_LIBRARY_PATH="$root/Release"
          "$root/Release/jsc" -e 'if (1 + 2 !== 3 || !WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0]))) throw new Error("JS/Wasm smoke failed"); print("PASS: JavaScript and Wasm validation");' 2>&1 | tee WebKitBuild/CI-logs/jsc-smoke.txt
          "$root/RunMiniBrowser.command" --smoke-test 2>&1 | tee WebKitBuild/CI-logs/browser-smoke.txt
      - name: Archive and reverify after extraction
        run: python3 .github/scripts/macos12-release.py archive
      - uses: actions/upload-artifact@v4
        with:
          name: macos12-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Keep diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos12-arm64-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: WebKitBuild/CI-logs/
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos12-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish immutable experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check ./*.sha256)
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "$RELEASE_TAG (best effort)" --notes-file dist/RELEASE.md \
            dist/*.tar.gz dist/*.sha256 dist/BUILD-METADATA.json dist/VERIFICATION.txt
